name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: mental_health_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d mental_health_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_PORT: 3001
      WEB_ORIGINS: http://localhost:5173
      VITE_API_BASE_URL: http://localhost:3001
      DATABASE_URL: postgresql://ci:ci-local-only@localhost:5432/mental_health_test
      TEST_DATABASE_URL: postgresql://ci:ci-local-only@localhost:5432/mental_health_test
      SESSION_TTL_SECONDS: 604800
      AGE_VERIFICATION_PROVIDER: mock
      REQUIRED_TERMS_VERSION: '1.0'
      REQUIRED_PRIVACY_VERSION: '1.0'
      LOG_LEVEL: silent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
